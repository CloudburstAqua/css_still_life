<style>
  * {
    box-sizing: border-box;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    background: #bbbced;
  }

  .frame {
    position: relative;
    width: 500px;
    height: 500px;
    border: 1px dashed;
  }

  .can_rect {
    position: absolute;
    right: 60px;
    bottom: 80px;
    width: 200px;
    height: 280px;
    background: #f2d166;
  }

  .can_ellipse1 {
    position: absolute;
    right: 60px;
    bottom: 60px;
    width: 200px;
    height: 40px;
    border-radius: 50%;
    background: #f2d166;
  }

  .can_ellipse2 {
    position: absolute;
    right: 60px;
    top: 120px;
    width: 200px;
    height: 40px;
    border-radius: 50%;
    background: #f2d166;
  }

  .can_light {
    position: absolute;
    right: 60px;
    top: 120px;
    width: 200px;
    height: 40px;
    border-radius: 50%;
    background: #ffe89c;
  }

  .pot_base {
    position: absolute;
    left: 40px;
    bottom: 90px;
    width: 180px;
    height: 200px;
    border-radius: 49% 51% 50% 50% / 90% 90% 10% 10%;
    background: #c9d6d3;
  }

  .pot_top {
    position: absolute;
    left: 30px;
    top: 40px;
    width: 200px;
    height: 200px;
    border-radius: 23% 23% 15% 15% / 8% 8% 80% 80%;
    background: #f06335;
  }

  .pot_lid {
    position: absolute;
    left: 30px;
    top: 20px;
    width: 200px;
    height: 80px;
    border-radius: 80%;
    background: #f06335;
  }

  .pot_mid {
    position: absolute;
    left: 60px;
    top: 240px;
    width: 140px;
    height: 30px;
    background: #f06335;
  }

  .pot_mid_curve {
    position: absolute;
    left: 60px;
    top: 245px;
    width: 140px;
    height: 40px;
    border-radius: 25%;
    background: #f06335;
  }

  .pot_tip {
    position: absolute;
    left: 110px;
    top: -10px;
    width: 30px;
    height: 35px;
    border-radius: 23% 23% 31% 31% / 8% 8% 80% 80%;
    background: #0a0202;
  }

  .pot_spout {
    position: absolute;
    left: 15px;
    top: 50px;
    width: 0;
    height: 0;
    border-left: 20px solid transparent;
    border-right: 40px solid transparent;
    border-top: 100px solid #f06335;
  }

  .pot_handle_or {
    position: absolute;
    left: 210px;
    top: 50px;
    --p: 20px; /* control the shape (can be percentage) */
    height: 40px;
    aspect-ratio: 4/3;
    clip-path: polygon(var(--p) 100%,calc(100% - var(--p)) 100%,100% 0,0 0);
    background: #f06335;
  }

  .pot_handle_blk {
    rotate: -25deg;
    position: absolute;
    --c: 75;
    /* control the curvature (a percentage value without unit bigger than 50%)*/
    left: 245px;
    top: 54;
    height: 100px;
    aspect-ratio: 1/2;
    background: #0a0202;
    mask: radial-gradient(100% calc(var(--c)*1%) at calc(-100%*cos(asin(50/var(--c)))), #0000 calc(100% - 1px), #000);
    clip-path: ellipse(100% calc(var(--c)*1%) at left);
  }
  
  .cup_base1 {
    position: absolute;
    right: 80px;
    top: 50px;
    width: 100px;
    height: 100px;
    background: #f5f0e1;
    border-radius: 23% 23% 21% 21% / 8% 8% 80% 80%; 
  }
  
  .cup_inner1 {
    position: absolute;
    right: 85px;
    top: 52px;
    width: 90px;
    height: 15px;
    border-radius: 40%;
    background: #807d6c;
  }
  
</style>


<div class="frame">
  <!-- add your elements here -->
  <div class="pot_base"></div>
  <div class="pot_top"></div>
  <div class="pot_lid"></div>
  <div class="pot_mid"></div>
  <div class="pot_mid_curve"></div>
  <div class="pot_tip"></div>
  <div class="pot_spout"></div>
  <div class="pot_handle_blk"></div>
  <div class="pot_handle_or"></div>
  <div class="can_rect"></div>
  <div class="can_ellipse1"></div>
  <div class="can_ellipse2"></div>
  <div class="can_light"></div>
  <div class="cup_base1"></div>
  <div class="cup_inner1"></div>
  
</div>
